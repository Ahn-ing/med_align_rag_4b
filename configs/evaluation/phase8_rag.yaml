  dpo_v2_adapter: artifacts/runs/phase_7/dpo_formal_v2/final_adapter
  dpo_v2_run_manifest: artifacts/runs/phase_7/dpo_formal_v2/run_manifest.json

arms:
  R0:
    model_source: base
    adapter: null
    rag: false
    purpose: "Base 无 RAG 基线"
  R1:
    model_source: base
    adapter: null
    rag: true
    purpose: "Base 完整 RAG"
  R2:
    model_source: base
    adapter: sft
    rag: false
    purpose: "SFT 无 RAG"
  R3:
    model_source: base
    adapter: sft
    rag: true
    purpose: "SFT 完整 RAG"
  R4:
    model_source: merged_sft
    adapter: dpo_v2
    rag: false
    purpose: "DPO v2 无 RAG"
  R5:
    model_source: merged_sft
    adapter: dpo_v2
    rag: true
    purpose: "DPO v2 完整 RAG"