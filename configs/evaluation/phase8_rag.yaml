  manifest: data/evaluation/validation_v4/manifest.json
  split: validation

base_system_prompt: "你是一个谨慎、清晰且遵循证据边界的助手。"

model_revisions:
  base: "1cfa9a7208912126459214e8b04321603b3df60c"
  merged_sft: "1cfa9a7208912126459214e8b04321603b3df60c"

generation:
