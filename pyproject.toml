[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "med-align-rag-4b"
version = "0.1.0"
description = "Reproducible, low-cost medical RAG and LLM alignment portfolio project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1,<2",
    "datasets>=5,<6",
    "huggingface-hub>=1,<2",
    "numpy>=2,<3",
    "PyYAML>=6,<7",
    "safetensors>=0.5,<1",
    "torch>=2.4,<3",
    "tqdm>=4.67,<5",
    "transformers>=5,<6",
]

[project.optional-dependencies]
rag = [
    "FlagEmbedding>=1.4,<2",
    "faiss-cpu>=1.12,<2",
]
sft = [
    "peft>=0.20,<1",
    "wandb>=0.22,<1",
]
research = [
    "bitsandbytes>=0.50,<1",
    "matplotlib>=3.10,<4",
    "pandas>=2,<4",
    "peft>=0.20,<1",
    "scikit-learn>=1.6,<2",
    "tensorboard>=2.20,<3",
    "trl>=0.27,<1",
    "wandb>=0.22,<1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/med_align_rag_4b"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
